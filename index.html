<style>
/* Concepto: guía de bolsillo de una columna. Barra de pestañas abajo para usarla con una mano. Los códigos SAP van en mono porque son el vocabulario del oficio. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #17202e; --muted: #5b6678; --line: #d9dfe8;
  --accent: #1d5fc4; --accent-ink: #ffffff; --accent-soft: #e3edfb;
  --key: #fff1b8; --key-ink: #4a3b00;
  --ok: #17795a; --ok-soft: #dcf3ea; --bad: #b4332f; --bad-soft: #fbe3e1;
  --warn-soft: #fdf0d9; --warn-ink: #7a4b05;
  --font: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #171f2b; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3546;
    --accent: #6aa6ff; --accent-ink: #0b1626; --accent-soft: #1b2b45;
    --key: #4a3f12; --key-ink: #ffe9a0;
    --ok: #5cd0a2; --ok-soft: #14352a; --bad: #ff8c86; --bad-soft: #3d1b1a;
    --warn-soft: #3a2c12; --warn-ink: #f3cf8e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #171f2b; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3546;
  --accent: #6aa6ff; --accent-ink: #0b1626; --accent-soft: #1b2b45;
  --key: #4a3f12; --key-ink: #ffe9a0;
  --ok: #5cd0a2; --ok-soft: #14352a; --bad: #ff8c86; --bad-soft: #3d1b1a;
  --warn-soft: #3a2c12; --warn-ink: #f3cf8e;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 100px;
}
.wrap { max-width: 640px; margin: 0 auto; }
button, input { font: inherit; color: inherit; touch-action: manipulation; }
header h1 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; font-weight: 600; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 26px 0 10px; }
.code { font-family: var(--mono); font-weight: 600; font-size: 14px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.pane[hidden] { display: none !important; }
.intro { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.card-h b { font-weight: 600; }
.card ul { margin: 0; padding-left: 18px; }
.card li { margin: 3px 0; }
.key { background: var(--key); color: var(--key-ink); padding: 8px 10px; border-radius: 8px; margin-top: 8px; font-size: 14px; }
.key::before { content: "Regla clave: "; font-weight: 600; }
.confirm { margin-top: 8px; font-size: 13px; color: var(--warn-ink); background: var(--warn-soft); padding: 6px 10px; border-radius: 8px; }
.confirm::before { content: "Por confirmar: "; font-weight: 600; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Hoy */
.cad { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cad span { font-size: 13px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cad span.hoy { background: var(--accent); color: var(--accent-ink); }
.prog { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 8px; }
.prog b { font-size: 15px; }
.mini { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.task { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 12px; margin-bottom: 8px; }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; display: grid; place-items: center; font-size: 22px; line-height: 1; color: transparent; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.task .n { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.task .tt { font-weight: 600; }
.task .ts { color: var(--muted); font-size: 14px; margin-top: 2px; }
.link { display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.task .body { min-width: 0; }

/* Procesos */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; padding: 10px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps { list-style: none; margin: 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.step { position: relative; padding-left: 44px; margin-bottom: 14px; }
.step .n { position: absolute; left: 0; top: 10px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 14px; border: 3px solid var(--bg); }
.steps.alt .n { border-radius: 10px; }
.ol { margin: 0; padding-left: 22px; }
.ol li { margin: 5px 0; }
.ol .m { font-family: var(--mono); font-weight: 600; }

/* Referencia */
.search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ref-row { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ref-row:last-child { border-bottom: 0; }
.ref-row .t { min-width: 0; }
.ref-row .t b { display: block; font-weight: 600; }
.ref-row .t span { color: var(--muted); font-size: 14px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 400px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.m { font-family: var(--mono); font-weight: 500; }
.sec-note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
.empty { color: var(--muted); padding: 12px 0; }

/* Dudas */
.duda { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 12px; margin-bottom: 8px; }
.duda.done .dt { color: var(--muted); text-decoration: line-through; }
.duda .dt { font-size: 15px; }
.duda .src { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Quiz */
.q-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.q-text { font-size: 19px; font-weight: 600; line-height: 1.3; margin: 0 0 14px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; min-height: 52px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.why b.ok { color: var(--ok); } .why b.no { color: var(--bad); }
.btn { display: block; width: 100%; margin-top: 14px; padding: 14px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.score { font-size: 44px; font-weight: 600; font-family: var(--mono); margin: 4px 0; }
.miss { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }

/* Barra inferior */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
nav.tabs button { padding: 11px 2px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; min-width: 0; }
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

/* ============ UTIL ============ */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function todayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

      '<div class="body"><div class="n">Prioridad ' + (i + 1) + '</div><div class="tt">' + esc(t.t) + '</div>' +

      (t.p ? '<button class="link" data-go="' + t.p + '">Ver pasos →</button>' : '') + '</div></div>';
  }).join('');

  $('progBar').style.width = (n / total * 100) + '%';
}
$('tareas').addEventListener('click', function (e) {

function stepsHtml(list, start, alt) {
  return '<ol class="steps' + (alt ? ' alt' : '') + '">' + list.map(function (s, i) {
    return '<li class="step"><span class="n">' + esc(s.m || (start + i)) + '</span><div class="card">' +
      '<div class="card-h"><span class="code">' + esc(s.c) + '</span><b>' + esc(s.n) + '</b></div>' +
      '<ul>' + s.pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
      (s.key ? '<div class="key">' + esc(s.key) + '</div>' : '') +
      (s.conf ? '<div class="confirm">' + esc(s.conf) + '</div>' : '') + '</div></li>';
  }).join('') + '</ol>';
}
function tableHtml(tb) {
  return '<div class="card tbl" style="margin-top:4px"><div class="card-h"><b>' + esc(tb.title) + '</b></div><table><thead><tr>' +
    tb.cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    tb.rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td' + (i === 0 || (tb.cols.length === 3 && i === 1) ? ' class="m"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table>' + (tb.conf ? '<div class="confirm">' + esc(tb.conf) + '</div>' : '') + '</div>';
}
function procHtml(p) {
  var h = p.intro ? '<p class="intro">' + esc(p.intro) + '</p>' : '';
  p.blocks.forEach(function (b) {
    h += '<h2>' + esc(b.h) + '</h2>';
    if (b.note) h += '<p class="intro" style="margin:0 0 12px">' + esc(b.note) + '</p>';
    if (b.ol) h += '<div class="card"><ol class="ol">' + b.ol.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    if (b.steps) h += stepsHtml(b.steps, 1, p.alt);
    if (b.table) h += tableHtml(b.table);
  });
  return h;
}
function showProc(id) {

  lsSet('gs_proc', p.id);

  if (act && act.scrollIntoView) { try { act.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}

function rowText(r) { return r.join(' ').toLowerCase(); }
function renderRef(q) {

    var rows = s.rows.filter(function (r) { return !q || rowText(r).indexOf(q) > -1 || s.title.toLowerCase().indexOf(q) > -1 || (s.note || '').toLowerCase().indexOf(q) > -1; });
    if (!rows.length) return;

    if (s.type === 'list') {
      out += '<div class="card">' + rows.map(function (r) {
        return '<div class="ref-row"><span><span class="code">' + esc(r[0]) + '</span></span><div class="t"><b>' + esc(r[1]) + '</b>' + (r[2] ? '<span>' + esc(r[2]) + '</span>' : '') + '</div></div>';

var qs = [], qi = 0, hits = 0, missed = [];
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function start(list) { qs = shuffle(list); qi = 0; hits = 0; missed = []; showQ(); }
function intro() {
  $('quiz').innerHTML = '<h2 style="margin-top:8px">Practicar</h2><div class="card"><p style="margin:0 0 4px"><b>' + BANK.length + ' preguntas</b> de tus apuntes.</p>' +
    '<p style="margin:0;color:var(--muted);font-size:14px">Cada respuesta trae su explicación. Al final puedes repetir solo las que fallaste.</p></div>' +
    '<button class="btn" id="go10">Ronda de 10 al azar</button><button class="btn ghost" id="go">Empezar con todas</button>';
  $('go').onclick = function () { start(BANK); };
  $('go10').onclick = function () { start(shuffle(BANK).slice(0, 10)); };
}
function showQ() {
  var q = qs[qi], opts = shuffle([q.ok].concat(q.bad));
  $('quiz').innerHTML = '<div class="q-meta"><span>Pregunta ' + (qi + 1) + ' de ' + qs.length + '</span><span>' + hits + ' correctas</span></div>' +
    '<div class="bar"><i style="width:' + (qi / qs.length * 100) + '%"></i></div>' +
    '<p class="q-text">' + esc(q.q) + '</p><div class="opts" id="opts"></div><div id="fb"></div>';
  var o = $('opts');
  opts.forEach(function (t) {
    var b = document.createElement('button'); b.className = 'opt'; b.textContent = t;
    b.onclick = function () { answer(b, t === q.ok, q); };
    o.appendChild(b);
  });
}
function answer(btn, good, q) {
  var all = document.querySelectorAll('#opts .opt');
  for (var i = 0; i < all.length; i++) { all[i].disabled = true; if (all[i].textContent === q.ok) all[i].classList.add('right'); }
  if (good) hits++; else { btn.classList.add('wrong'); missed.push(q); }
  var last = qi === qs.length - 1;
  $('fb').innerHTML = '<div class="why"><b class="' + (good ? 'ok' : 'no') + '">' + (good ? 'Correcto. ' : 'No era esa. ') + '</b>' + esc(q.why) + '</div><button class="btn" id="nx">' + (last ? 'Ver resultado' : 'Siguiente') + '</button>';
  var nx = $('nx');
  nx.onclick = function () { if (last) done(); else { qi++; showQ(); } };
  try { nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
}
function done() {
  $('quiz').innerHTML = '<h2 style="margin-top:8px">Resultado</h2><div class="card"><div class="score">' + hits + ' / ' + qs.length + '</div>' +
    (missed.length ? '<p style="margin:0">Para repasar:</p><ul class="miss">' + missed.map(function (m) { return '<li>' + esc(m.q) + '</li>'; }).join('') + '</ul>' : '<p style="margin:0">Todas correctas.</p>') + '</div>' +
    (missed.length ? '<button class="btn" id="rm">Repetir las falladas</button>' : '') + '<button class="btn ghost" id="ra">Volver al inicio</button>';
  if (missed.length) $('rm').onclick = function () { start(missed.slice()); };
  $('ra').onclick = intro;
}
intro();

}
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (b) {

});
